name: Deploy Crios & Rango Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/catalog-runtime-parity
      - fix/category-grid-app-parity
      - feat/outlet-bubbles
      - feat/wp-login-branding
      - style/product-detail-app-skin
    paths:
      - "theme/**"
      - "tests/catalog-contract.test.cjs"
      - "tests/product-skin-contract.test.cjs"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/catalog-contract.yml"

permissions:
  contents: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/fix/catalog-runtime-parity' || github.ref == 'refs/heads/fix/category-grid-app-parity' || github.ref == 'refs/heads/feat/outlet-bubbles' || github.ref == 'refs/heads/feat/wp-login-branding' || github.ref == 'refs/heads/style/product-detail-app-skin') && 'crios-rango-staging' || 'crios-rango-production' }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bootstrap theme 0.2.0 if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "theme/crios-rango-2026/style.css" ]; then
            echo "Theme already present. Bootstrap skipped."
            exit 0
          fi

          if [ "$GITHUB_REF" = "refs/heads/fix/catalog-runtime-parity" ] || [ "$GITHUB_REF" = "refs/heads/fix/category-grid-app-parity" ] || [ "$GITHUB_REF" = "refs/heads/feat/wp-login-branding" ] || [ "$GITHUB_REF" = "refs/heads/style/product-detail-app-skin" ]; then
            echo "ERROR: staging deploy must not bootstrap or push to main."
            exit 1
          fi

          mkdir -p /tmp/crios-bootstrap theme

