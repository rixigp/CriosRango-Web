name: Staging Browser Inspector

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Staging URL to inspect"
        required: true
        type: string
        default: "https://criosrango.es/prueba/"
      viewport_width:
        description: "Viewport width in CSS pixels"
        required: true
        type: number
        default: 1440
      viewport_height:
        description: "Viewport height in CSS pixels"
        required: true
        type: number
        default: 900
      selector:
        description: "Optional CSS selector"
        required: false
        type: string
        default: ".cr-parent-category__toolbar"

permissions:
  contents: read

concurrency:
  group: staging-browser-inspector
  cancel-in-progress: false

jobs:
  inspect-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-staging-inspector-v1
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-playwright-1.65.1
          restore-keys: |
            ${{ runner.os }}-chromium-playwright-
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install chromium
      - name: Inspect staging with Chromium
        env:
          INSPECT_URL: ${{ inputs.url }}
          INSPECT_WIDTH: ${{ inputs.viewport_width }}
          INSPECT_HEIGHT: ${{ inputs.viewport_height }}
          INSPECT_SELECTOR: ${{ inputs.selector }}
          INSPECT_OUTPUT_DIR: artifacts
          STAGING_ACCOUNT_EMAIL: ${{ secrets.STAGING_ACCOUNT_EMAIL }}
          STAGING_ACCOUNT_PASSWORD: ${{ secrets.STAGING_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--url="$INSPECT_URL" --width="$INSPECT_WIDTH" --height="$INSPECT_HEIGHT")
          if [ -n "$INSPECT_SELECTOR" ]; then args+=(--selector="$INSPECT_SELECTOR"); fi
          node tests/staging-browser-inspect.cjs "${args[@]}"
      - name: Upload inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-inspection
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
