name: Temporary production filter cache benchmark
on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/filter-cache-benchmark.yml"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify plugin version and benchmark cold/warm cache
        env:
          BASE_URL: https://criosrango.es/wp-json/criosrango-filter/v1/query
        run: |
          node <<'NODE'
          const facets = ["sizes", "colors", "brands"];
          const base = process.env.BASE_URL;
          const rounds = [];
          async function request(facet) {
            const url = new URL(base);
            url.search = new URLSearchParams({scope:"catalog", facet, page:"1", per_page:"1"}).toString();
            const start = performance.now();
            let response, bodyText = "";
            try {
              response = await fetch(url, {headers: {"accept":"application/json"}});
              bodyText = await response.text();
              const ms = Math.round(performance.now() - start);
              let json = null, valid = false, detail = "";
              try {
                json = JSON.parse(bodyText);
                valid = !!json && typeof json === "object" && !Array.isArray(json) && Object.keys(json).length > 0;
                detail = Object.keys(json || {}).join(",");
              } catch (e) { detail = "invalid-json"; }
              return {
                facet, ms, http: response.status,
                cache: response.headers.get("x-criosrango-filter-cache") || "MISSING",
                version: response.headers.get("x-criosrango-filter-version") || "MISSING",
                contentType: response.headers.get("content-type") || "",
                bytes: Buffer.byteLength(bodyText),
                valid, detail, body: bodyText.slice(0, 1200)
              };
            } catch (e) {
              return {facet, ms: Math.round(performance.now()-start), http: 0, cache:"ERROR", version:"MISSING", valid:false, detail:String(e)};
            }
          }
          const first = await request("sizes");
          console.log("VERSION_PROBE=" + JSON.stringify({http:first.http, version:first.version, cache:first.cache}));
          // Reuse the first request as the sizes sample for round 1 cold.
          for (let r=1; r<=3; r++) {
            const cold = r===1 ? [first, ...(await Promise.all(["colors","brands"].map(request)))] : await Promise.all(facets.map(request));
            const warm = await Promise.all(facets.map(request));
            rounds.push({round:r, cold, warm});
            console.log("ROUND_" + r + "=" + JSON.stringify({cold:cold.map(x=>({facet:x.facet,ms:x.ms,cache:x.cache,http:x.http,version:x.version,valid:x.valid,bytes:x.bytes,detail:x.detail})),warm:warm.map(x=>({facet:x.facet,ms:x.ms,cache:x.cache,http:x.http,version:x.version,valid:x.valid,bytes:x.bytes,detail:x.detail}))}));
            for (const x of [...cold,...warm]) if (!x.valid || x.http!==200) console.log("INVALID_RESPONSE=" + JSON.stringify(x));
          }
          console.log("FULL_RESULTS=" + JSON.stringify(rounds));
          NODE
