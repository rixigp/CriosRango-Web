name: Temporary live filter endpoint benchmark

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/filter-endpoint-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Measure live production facet requests in parallel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, time, urllib.request, urllib.error
          base="https://criosrango.es/wp-json/criosrango-filter/v1/query"
          facets=("sizes","colors","brands")
          def request(facet, round_no):
              url=base+"?scope=catalog&facet="+facet+"&page=1&per_page=1"
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"CriosRango-Filter-Diagnostic/1.0"})
              start=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=90) as response:
                      body=response.read()
                      elapsed=(time.perf_counter()-start)*1000
                      headers=response.headers
                      try: payload=json.loads(body)
                      except Exception: payload={}
                      facets_data=payload.get("facets",{}) if isinstance(payload,dict) else {}
                      return {"round":round_no,"facet":facet,"status":response.status,"time_ms":round(elapsed),"bytes":len(body),
                              "server_timing":headers.get("Server-Timing"),"cache":headers.get("X-Cache") or headers.get("CF-Cache-Status") or headers.get("Cache-Control"),
                              "facet_terms":len(facets_data.get(facet,[])) if isinstance(facets_data,dict) else None,
                              "error":payload.get("message") if isinstance(payload,dict) else None}
              except Exception as e:
                  return {"round":round_no,"facet":facet,"error":repr(e),"time_ms":round((time.perf_counter()-start)*1000)}
          results=[]
          for round_no in range(1,4):
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  batch=list(pool.map(lambda f:request(f,round_no),facets))
              results.extend(batch)
              print("BENCHMARK_ROUND_"+str(round_no)+"="+json.dumps(batch,ensure_ascii=False))
          for facet in facets:
              values=[x["time_ms"] for x in results if x["facet"]==facet and "status" in x]
              print("CURRENT_"+facet.upper()+"_TIME_MS="+(str(round(values[-1])) if values else "UNAVAILABLE"))
              if values: print("SUMMARY_"+facet.upper()+"_MIN_MEDIAN_MAX_MS="+json.dumps([min(values),sorted(values)[len(values)//2],max(values)]))
          PY
