name: Temporary read-only campaign plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-campaign-plugin-inspect.yml"

permissions:
  contents: read

jobs:
  inspect-campaign-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Inspect only crios-rango-enlaces PHP and CSS
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"

          WORK=/tmp/crios-rango-enlaces
          mkdir -p "$WORK/files"
          FIND_SCRIPT="$(mktemp)"
          GET_SCRIPT="$(mktemp)"
          trap 'rm -f "$FIND_SCRIPT" "$GET_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_lftp_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:21"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST"
          }

          {
            make_lftp_header
            printf 'find plugins/crios-rango-enlaces/ -type f\n'
            printf 'bye\n'
          } > "$FIND_SCRIPT"
          lftp -f "$FIND_SCRIPT" > "$WORK/remote-files.txt"

          awk '/^plugins\/crios-rango-enlaces\// && /\.(php|css)$/ {print}' "$WORK/remote-files.txt" | sort -u > "$WORK/allowed-files.txt"

          echo "PLUGIN_PATH=plugins/crios-rango-enlaces/"
          echo "PLUGIN_RESOURCE_FILES_BEGIN"
          cat "$WORK/allowed-files.txt"
          echo "PLUGIN_RESOURCE_FILES_END"
          echo "PLUGIN_RESOURCE_FILE_COUNT=$(wc -l < "$WORK/allowed-files.txt")"

          if [ ! -s "$WORK/allowed-files.txt" ]; then
            echo "PLUGIN_FILES_FOUND=NO"
            exit 0
          fi

          {
            make_lftp_header
            while IFS= read -r remote; do
              [ -n "$remote" ] || continue
              local="${remote#plugins/crios-rango-enlaces/}"
              mkdir -p "$WORK/files/$(dirname "$local")"
              printf 'get "%s" -o "%s/files/%s"\n' "$remote" "$WORK" "$local"
            done < "$WORK/allowed-files.txt"
            printf 'bye\n'
          } > "$GET_SCRIPT"
          lftp -f "$GET_SCRIPT"

          echo "===== PLUGIN HEADER AND ENLACES REFERENCES ====="
          grep -RniE 'Plugin Name:|Version:|Description:|/enlaces/|enlaces|campaign|campaña|rewrite_rule|template_redirect|shortcode|margin-top|padding-top|min-height|cr-page-shell|wp_enqueue_style|wp_head|template_include' "$WORK/files" || true

          echo "===== COMPLETE PHP/CSS SOURCE ====="
          find "$WORK/files" -type f \( -name '*.php' -o -name '*.css' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "===== FILE: ${file#"$WORK/files/"} ====="
            nl -ba "$file"
          done
