name: Temporary read-only exact campaign plugin search

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-campaign-plugin-search.yml"

permissions:
  contents: read

jobs:
  search-plugin-php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Search literal plugin header and routes in PHP under plugins only
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"

          WORK=/tmp/campaign-plugin-php
          mkdir -p "$WORK/files"
          FIND_SCRIPT="$(mktemp)"
          GET_SCRIPT="$(mktemp)"
          trap 'rm -f "$FIND_SCRIPT" "$GET_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_lftp_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 25\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:21"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST"
          }

          # Enumerate PHP files recursively, but strictly inside plugins/.
          {
            make_lftp_header
            printf 'find plugins/ -type f\n'
            printf 'bye\n'
          } > "$FIND_SCRIPT"
          lftp -f "$FIND_SCRIPT" > "$WORK/remote-files.txt"

          awk '/^plugins\// && /\.php$/ {print}' "$WORK/remote-files.txt" | sort -u > "$WORK/php-files.txt"

          echo "FTP_ROOT=wp-content"
          echo "SEARCH_SCOPE=plugins/**/*.php"
          echo "OTHER_WP_CONTENT_DIRS=NOT_TOUCHED"
          echo "MU_PLUGINS=NOT_TOUCHED"
          echo "THEMES=NOT_TOUCHED"
          echo "PHP_FILE_COUNT=$(wc -l < "$WORK/php-files.txt")"
          echo "PHP_PATHS_BEGIN"
          cat "$WORK/php-files.txt"
          echo "PHP_PATHS_END"

          if [ ! -s "$WORK/php-files.txt" ]; then
            echo "ENLACES_PLUGIN_FOUND=NO_PHP_FILES"
            exit 0
          fi

          {
            make_lftp_header
            while IFS= read -r remote; do
              [ -n "$remote" ] || continue
              local="${remote#plugins/}"
              mkdir -p "$WORK/files/$(dirname "$local")"
              printf 'get "%s" -o "%s/files/%s"\n' "$remote" "$WORK" "$local"
            done < "$WORK/php-files.txt"
            printf 'bye\n'
          } > "$GET_SCRIPT"
          lftp -f "$GET_SCRIPT"

          echo "===== EXACT STRING MATCHES ====="
          grep -RnilF -- 'Críos & Rango | Enlaces de campaña' "$WORK/files" || true
          grep -RnilF -- 'Enlaces de campaña' "$WORK/files" || true
          grep -RnilF -- '/enlaces/' "$WORK/files" || true

          MATCHES="$WORK/exact-plugin-matches.txt"
          grep -RilF -- 'Críos & Rango | Enlaces de campaña' "$WORK/files" > "$MATCHES" || true
          if [ ! -s "$MATCHES" ]; then
            grep -RilF -- 'Enlaces de campaña' "$WORK/files" > "$MATCHES" || true
          fi

          if [ -s "$MATCHES" ]; then
            echo "ENLACES_PLUGIN_FOUND=YES"
            while IFS= read -r file; do
              rel="${file#"$WORK/files/"}"
              echo "PLUGIN_FILE=$rel"
              echo "PLUGIN_NAME=$(grep -im1 'Plugin Name:' "$file" | sed -E 's/.*Plugin Name:[[:space:]]*//')"
              echo "MATCHED_PLUGIN_SOURCE_BEGIN"
              nl -ba "$file"
              echo "MATCHED_PLUGIN_SOURCE_END"
            done < "$MATCHES"
          else
            echo "ENLACES_PLUGIN_FOUND=NO_LITERAL_MATCH"
            echo "PLUGIN_NAME=NOT_FOUND"
          fi
