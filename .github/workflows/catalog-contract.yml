name: Catalog runtime contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "theme/crios-rango-2026/**"
      - "tests/catalog-contract.test.cjs"
      - ".github/workflows/catalog-contract.yml"
  push:
    branches:
      - main
    paths:
      - "theme/crios-rango-2026/**"
      - "tests/catalog-contract.test.cjs"
      - ".github/workflows/catalog-contract.yml"

permissions:
  contents: read

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check theme/crios-rango-2026/assets/js/main.js
      - name: Run catalog contract tests
        run: node --test tests/catalog-contract.test.cjs
      - name: Install PHP CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli
      - name: Lint theme PHP
        run: |
          find theme/crios-rango-2026 -type f -name "*.php" -print0 \
            | xargs -0 -r -n1 php -l
