name: Temporary read-only campaign links plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-campaign-links-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Identify Críos Rango plugin headers only
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
          WP_CONTENT_FTP_PATH: ${{ secrets.WP_CONTENT_FTP_PATH }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"
          : "${WP_CONTENT_FTP_PATH:?Missing WP_CONTENT_FTP_PATH}"

          WORK=/tmp/campaign-links-plugin
          mkdir -p "$WORK"
          LIST_SCRIPT="$(mktemp)"
          GET_SCRIPT="$(mktemp)"
          trap 'rm -f "$LIST_SCRIPT" "$GET_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:21"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST"
          }

          cat > "$WORK/crios-directories.txt" <<'EOF'
          plugins/criosrango-cache-catalogo
          plugins/criosrango-configuracion-inicio
          plugins/criosrango-cuenta-app
          plugins/criosrango-filtros-catalogo
          plugins/criosrango-notificaciones-push
          plugins/criosrango-origen-outlet
          plugins/criosrango-pagos-app
          plugins/criosrango-pedidos-app
          EOF

          : > "$WORK/root-php.txt"
          while IFS= read -r dir; do
            {
              make_header
              printf 'cd "%s"\n' "$dir"
              printf 'cls -1\n'
              printf 'bye\n'
            } > "$LIST_SCRIPT"
            lftp -f "$LIST_SCRIPT" > "$WORK/root-list.txt"
            grep -E '^[A-Za-z0-9._-]+\.php$' "$WORK/root-list.txt" |
              sed "s#^#$dir/#" >> "$WORK/root-php.txt" || true
          done < "$WORK/crios-directories.txt"
          sort -u "$WORK/root-php.txt" -o "$WORK/root-php.txt"

          echo "FTP_ROOT=wp-content"
          echo "INSPECTED_DIRECTORIES=8_criosrango_plugin_roots_only"
          echo "THEME_FILES_SCANNED=NO"
          echo "THEME_FILES_DOWNLOADED=NO"
          echo "ROOT_PLUGIN_PHP_FILES=$(wc -l < "$WORK/root-php.txt" | tr -d ' ')"
          cat "$WORK/root-php.txt"

          {
            make_header
            while IFS= read -r remote_file; do
              [ -n "$remote_file" ] || continue
              local_file="$WORK/$remote_file"
              mkdir -p "$(dirname "$local_file")"
              printf 'get "%s" -o "%s"\n' "$remote_file" "$local_file"
            done < "$WORK/root-php.txt"
            printf 'bye\n'
          } > "$GET_SCRIPT"
          lftp -f "$GET_SCRIPT"

          echo "===== PLUGIN HEADERS / NAME MATCHES ====="
          grep -RniE --include='*.php' 'Plugin Name:|enlaces|campaña|campana|campaign|links' "$WORK/plugins" || true
