name: Temporary read-only WordPress plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-wp-content:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Read chroot and download PHP from relative plugin directories
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
          WP_CONTENT_FTP_PATH: ${{ secrets.WP_CONTENT_FTP_PATH }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"

          WORK=/tmp/wp-content
          mkdir -p "$WORK/plugins" "$WORK/mu-plugins"
          ROOT_SCRIPT="$(mktemp)"
          DOWNLOAD_SCRIPT="$(mktemp)"
          trap 'rm -f "$ROOT_SCRIPT" "$DOWNLOAD_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          # The FTP account is confirmed to be chrooted directly at wp-content.
          # Do not cd to the configured legacy absolute path or prefix any path.
          BASE_PATH="."
          {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:%s"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST" "${SFTP_PORT:-21}"
            printf 'pwd\n'
            printf 'cls -la\n'
            printf 'cd .\n'
            printf 'cls -la\n'
            printf 'bye\n'
          } > "$ROOT_SCRIPT"
          lftp -f "$ROOT_SCRIPT" > /tmp/wp-content-root.log 2>&1

          echo "FTP_CONNECTION=OK"
          echo "FTP_ROOT=wp-content"
          echo "FTP_INITIAL_PWD=/ (FTP chroot root; host/port suppressed)"
          echo "WP_CONTENT_FTP_PATH_RESOLVED=."
          echo "FTP_ROOT_CONTENTS_BEGIN"
          sed -E '/^[^ ]+:[0-9]+\/?$/d; s#ftp://[^ ]+#ftp://[redacted]#g' /tmp/wp-content-root.log
          echo "FTP_ROOT_CONTENTS_END"

          # Validate only the two confirmed relative directories.
          {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:%s"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST" "${SFTP_PORT:-21}"
            printf 'cd .\n'
            printf 'cls -la plugins\n'
            printf 'cls -la mu-plugins\n'
            printf 'bye\n'
          } > "$DOWNLOAD_SCRIPT"
          lftp -f "$DOWNLOAD_SCRIPT" > /tmp/wp-content-dir-listing.log 2>&1
          echo "PLUGINS_PATH=plugins/"
          echo "MU_PLUGINS_PATH=mu-plugins/"
          echo "RELATIVE_PLUGIN_LISTINGS_BEGIN"
          sed -E '/^[^ ]+:[0-9]+\/?$/d; s#ftp://[^ ]+#ftp://[redacted]#g' /tmp/wp-content-dir-listing.log | head -n 200
          echo "RELATIVE_PLUGIN_LISTINGS_END"

          # Download PHP files only; no remote write commands are issued.
          {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:%s"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST" "${SFTP_PORT:-21}"
            printf 'cd .\n'
            printf 'mirror --verbose=0 --include-glob=*.php --exclude-glob=* plugins "$WORK/plugins"\n'
            printf 'mirror --verbose=0 --include-glob=*.php --exclude-glob=* mu-plugins "$WORK/mu-plugins"\n'
            printf 'bye\n'
          } > "$DOWNLOAD_SCRIPT"
          lftp -f "$DOWNLOAD_SCRIPT"
          echo "LOCAL_PHP_FILES=$(find "$WORK" -type f -name '*.php' | wc -l)"

      - name: Find REST route and inspect callback source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wp-content
          echo "===== EXACT ROUTE SEARCH ====="
          grep -Rni --include='*.php' 'criosrango-filter' "$ROOT" || true
          grep -Rni --include='*.php' 'criosrango-filter/v1' "$ROOT" || true
          echo "===== CRIOS REGISTER_REST_ROUTE ====="
          grep -Rni --include='*.php' 'register_rest_route' "$ROOT" | grep -i 'crios' || true

          MATCH="$(grep -Ril --include='*.php' 'criosrango-filter/v1' "$ROOT" | head -n 1 || true)"
          if [ -z "$MATCH" ]; then
            MATCH="$(grep -Ril --include='*.php' 'criosrango-filter' "$ROOT" | head -n 1 || true)"
          fi
          if [ -z "$MATCH" ]; then
            echo "FILTER_API_IMPLEMENTATION_FOUND=NO"
            exit 0
          fi

          echo "FILTER_API_IMPLEMENTATION_FOUND=YES"
          RELATIVE_FILE="${MATCH#"$ROOT"/}"
          echo "PLUGIN_PATH=${RELATIVE_FILE%%/*}/"
          echo "PLUGIN_NAME=${RELATIVE_FILE%%/*}"
          echo "ENDPOINT_FILE=$RELATIVE_FILE"
          echo "===== MATCHING SOURCE ====="
          nl -ba "$MATCH" | sed -n '1,360p'
          echo "===== REST ROUTE AND CALLBACK CONTEXT ====="
          grep -Rni --include='*.php' -C 12 'criosrango-filter/v1' "$ROOT" || true
          echo "===== CALLBACK PERFORMANCE SIGNALS ====="
          grep -Rni --include='*.php' -E 'WP_Query|wc_get_products|wc_get_product|variations|get_available_variations|get_children|get_post_meta|update_post_meta|get_transient|set_transient|wp_cache_(get|set)|wc_product_attributes_lookup|\$wpdb' "$(dirname "$MATCH")" || true
