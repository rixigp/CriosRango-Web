name: Temporary read-only campaign links plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-campaign-links-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Locate plugin by directory and header
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
          WP_CONTENT_FTP_PATH: ${{ secrets.WP_CONTENT_FTP_PATH }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"
          : "${WP_CONTENT_FTP_PATH:?Missing WP_CONTENT_FTP_PATH}"

          WORK=/tmp/campaign-links-plugin
          mkdir -p "$WORK"
          SCRIPT="$(mktemp)"
          trap 'rm -f "$SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:21"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST"
          }

          # FTP chroot is already wp-content; WP_CONTENT_FTP_PATH is only validated,
          # never used to escape or broaden the permitted root.
          {
            make_header
            printf 'cd plugins/\n'
            printf 'cls -1\n'
            printf 'bye\n'
          } > "$SCRIPT"
          lftp -f "$SCRIPT" > "$WORK/plugin-directories.txt"

          echo "FTP_ROOT=wp-content"
          echo "SEARCH_SCOPE=plugins/"
          echo "THEME_FILES_SCANNED=NO"
          echo "THEME_FILES_DOWNLOADED=NO"
          echo "PLUGIN_DIRECTORIES_BEGIN"
          cat "$WORK/plugin-directories.txt"
          echo "PLUGIN_DIRECTORIES_END"

          grep -Ei 'crios|enlaces|campana|links' "$WORK/plugin-directories.txt" > "$WORK/name-matches.txt" || true
          echo "PLUGIN_NAME_MATCHES_BEGIN"
          cat "$WORK/name-matches.txt"
          echo "PLUGIN_NAME_MATCHES_END"

          # No plugin source is downloaded at this stage. If the exact directory
          # is not apparent, the directory listing is the evidence for next step.
          if [ -s "$WORK/name-matches.txt" ]; then
            echo "PLUGIN_DIRECTORY_CANDIDATES=$(paste -sd ';' "$WORK/name-matches.txt")"
          else
            echo "PLUGIN_DIRECTORY_CANDIDATES=NO_DIRECT_NAME_MATCH"
          fi
