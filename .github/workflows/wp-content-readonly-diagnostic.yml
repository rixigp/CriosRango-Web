name: Temporary read-only WordPress plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-plugin-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: List plugin names and inspect candidates only
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"

          WORK=/tmp/wp-plugin-candidates
          mkdir -p "$WORK"
          BASE_SCRIPT="$(mktemp)"
          LIST_SCRIPT="$(mktemp)"
          FIND_SCRIPT="$(mktemp)"
          GET_SCRIPT="$(mktemp)"
          trap 'rm -f "$BASE_SCRIPT" "$LIST_SCRIPT" "$FIND_SCRIPT" "$GET_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_lftp_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:%s"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST" "${SFTP_PORT:-21}"
          }

          # The only directory listings in this workflow are these two direct children.
          {
            make_lftp_header
            printf 'cd plugins/\n'
            printf 'cls -la\n'
            printf 'bye\n'
          } > "$LIST_SCRIPT"
          lftp -f "$LIST_SCRIPT" > "$WORK/plugins.names"

          {
            make_lftp_header
            printf 'cd mu-plugins/\n'
            printf 'cls -la\n'
            printf 'bye\n'
          } > "$LIST_SCRIPT"
          lftp -f "$LIST_SCRIPT" > "$WORK/mu-plugins.names"

          normalize_names() {
            awk '$1 ~ /^d/ {print $NF}' "$1" |
              sed -E 's#/$##' |
              grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*$' |
              sort -fu || true
          }
          normalize_names "$WORK/plugins.names" > "$WORK/plugins.normalized"
          normalize_names "$WORK/mu-plugins.names" > "$WORK/mu-plugins.normalized"
          awk '$1 !~ /^d/ && $NF ~ /\.php$/ {print $NF}' "$WORK/mu-plugins.names" |
            sed -E 's#\\r$##' |
            grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*\.php$' |
            sort -fu >> "$WORK/mu-plugins.normalized"
          sort -fu "$WORK/mu-plugins.normalized" -o "$WORK/mu-plugins.normalized"

          echo "FTP_ROOT=wp-content"
          echo "SEARCH_PATHS=plugins/,mu-plugins/"
          echo "UPLOADS_SCANNED=NO"
          echo "UPLOADS_DOWNLOADED=NO"
          echo "THEMES_DOWNLOADED=NO"
          echo "MEDIA_DOWNLOADED=NO"
          echo "===== PLUGINS DIRECT NAMES ====="
          cat "$WORK/plugins.normalized"
          echo "===== MU-PLUGINS DIRECT NAMES ====="
          cat "$WORK/mu-plugins.normalized"

          : > "$WORK/candidates.txt"
          for base in plugins mu-plugins; do
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if printf '%s\n' "$name" | grep -Eiq '(crios|rango|filter|api|rest|woocommerce|custom)'; then
                printf '%s/%s\n' "$base" "$name" >> "$WORK/candidates.txt"
              fi
            done < "$WORK/$base.normalized"
          done

          echo "===== PRIORITIZED CANDIDATES ====="
          sort -fu "$WORK/candidates.txt" -o "$WORK/candidates.txt"
          cat "$WORK/candidates.txt"
          echo "PLUGIN_CANDIDATES=$(paste -sd ';' "$WORK/candidates.txt")"

          if [ ! -s "$WORK/candidates.txt" ]; then
            echo "FILTER_API_IMPLEMENTATION_FOUND=NO_CANDIDATES"
            exit 0
          fi

          # Process one candidate at a time; stop immediately when the route is found.
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            echo "INSPECTING_CANDIDATE=$candidate"
            : > "$WORK/current-php.txt"

            if printf '%s' "$candidate" | grep -Eiq '\.php$'; then
              printf '%s\n' "$candidate" > "$WORK/current-php.txt"
            else
              {
                make_lftp_header
                printf 'find "%s"\n' "$candidate"
                printf 'bye\n'
              } > "$FIND_SCRIPT"
              lftp -f "$FIND_SCRIPT" > "$WORK/current-find.txt"
              grep -E "^$candidate/[A-Za-z0-9._/-]+\.php$" "$WORK/current-find.txt" |
                grep -Ev '(^|/)\.\.?(/|$)' |
                sort -u > "$WORK/current-php.txt" || true
            fi

            if [ -s "$WORK/current-php.txt" ]; then
              {
                make_lftp_header
                while IFS= read -r remote_file; do
                  local_file="$WORK/$remote_file"
                  mkdir -p "$(dirname "$local_file")"
                  printf 'get "%s" -o "%s"\n' "$remote_file" "$local_file"
                done < "$WORK/current-php.txt"
                printf 'bye\n'
              } > "$GET_SCRIPT"
              lftp -f "$GET_SCRIPT"
            fi

            if grep -Rni --include='*.php' -E 'criosrango-filter(/v1)?|register_rest_route' "$WORK" > "$WORK/current-matches.txt"; then
              echo "FILTER_API_IMPLEMENTATION_FOUND=YES"
              cat "$WORK/current-matches.txt"
              echo "MATCHING_PHP_FILES_BEGIN"
              while IFS= read -r matched_file; do
                file="${matched_file%%:*}"
                case "$file" in
                  "$WORK/"*) ;;
                  *) continue ;;
                esac
                echo "===== SOURCE: ${file#"$WORK"/} ====="
                nl -ba "$file" | sed -n '1,420p'
              done < <(cut -d: -f1 "$WORK/current-matches.txt" | sort -u)
              exit 0
            fi
            echo "CANDIDATE_ROUTE_MATCH=NO"
          done < "$WORK/candidates.txt"

          echo "FILTER_API_IMPLEMENTATION_FOUND=NO_IN_PRIORITIZED_CANDIDATES"
