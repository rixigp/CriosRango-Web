name: Temporary read-only campaign links plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-other-plugin-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Verify remaining active plugin headers only
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
          WP_CONTENT_FTP_PATH: ${{ secrets.WP_CONTENT_FTP_PATH }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"
          : "${WP_CONTENT_FTP_PATH:?Missing WP_CONTENT_FTP_PATH}"

          WORK=/tmp/campaign-links-plugin
          mkdir -p "$WORK"
          LIST_SCRIPT="$(mktemp)"
          GET_SCRIPT="$(mktemp)"
          trap 'rm -f "$LIST_SCRIPT" "$GET_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:21"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST"
          }

          cat > "$WORK/other-directories.txt" <<'EOF'
          plugins/advanced-dynamic-pricing-for-woocommerce-pro
          plugins/cecabank-woocommerce-0.4.1
          plugins/contact-form-71
          plugins/cookie-law-info
          plugins/google-listings-and-ads
          plugins/prodscribe-ai-for-woocommerce
          plugins/variation-swatches-for-woocommerce
          plugins/woocommerce
          plugins/woocommerce-payments
          plugins/woocommerce-pdf-invoices-packing-slips
          plugins/wp-frontend-delete-account
          plugins/wployalty
          plugins/wps-hide-login
          plugins/yith-woocommerce-ajax-navigation
          plugins/yith-woocommerce-wishlist1
          EOF

          : > "$WORK/other-root-php.txt"
          while IFS= read -r dir; do
            {
              make_header
              printf 'cd "%s"\n' "$dir"
              printf 'cls -1\n'
              printf 'bye\n'
            } > "$LIST_SCRIPT"
            lftp -f "$LIST_SCRIPT" > "$WORK/root-list.txt"
            grep -E '^[A-Za-z0-9._-]+\.php$' "$WORK/root-list.txt" |
              sed "s#^#$dir/#" >> "$WORK/other-root-php.txt" || true
          done < "$WORK/other-directories.txt"
          sort -u "$WORK/other-root-php.txt" -o "$WORK/other-root-php.txt"

          echo "FTP_ROOT=wp-content"
          echo "INSPECTED_SCOPE=remaining_active_plugin_root_php_only"
          echo "THEME_FILES_SCANNED=NO"
          echo "THEME_FILES_DOWNLOADED=NO"
          echo "ROOT_PLUGIN_PHP_FILES=$(wc -l < "$WORK/other-root-php.txt" | tr -d ' ')"
          cat "$WORK/other-root-php.txt"

          {
            make_header
            while IFS= read -r remote_file; do
              [ -n "$remote_file" ] || continue
              local_file="$WORK/$remote_file"
              mkdir -p "$(dirname "$local_file")"
              printf 'get "%s" -o "%s"\n' "$remote_file" "$local_file"
            done < "$WORK/other-root-php.txt"
            printf 'bye\n'
          } > "$GET_SCRIPT"
          lftp -f "$GET_SCRIPT"

          echo "===== PLUGIN HEADERS / CAMPAIGN LINKS MATCHES ====="
          grep -RniE --include='*.php' 'Plugin Name:|Enlaces de campaña|enlaces de campana|campaign links|campaign-links' "$WORK/plugins" || true
