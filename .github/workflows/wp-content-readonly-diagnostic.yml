name: Temporary read-only campaign links plugin inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/wp-content-readonly-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-config-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Check only the relevant custom plugin for Enlaces page code
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
          WP_CONTENT_FTP_PATH: ${{ secrets.WP_CONTENT_FTP_PATH }}
        run: |
          set -euo pipefail
          : "${WP_CONTENT_FTP_HOST:?Missing WP_CONTENT_FTP_HOST}"
          : "${WP_CONTENT_FTP_USER:?Missing WP_CONTENT_FTP_USER}"
          : "${WP_CONTENT_FTP_PASSWORD:?Missing WP_CONTENT_FTP_PASSWORD}"
          : "${WP_CONTENT_FTP_PATH:?Missing WP_CONTENT_FTP_PATH}"

          WORK=/tmp/campaign-links-plugin
          mkdir -p "$WORK"
          FIND_SCRIPT="$(mktemp)"
          GET_SCRIPT="$(mktemp)"
          trap 'rm -f "$FIND_SCRIPT" "$GET_SCRIPT"; unset WP_CONTENT_FTP_PASSWORD' EXIT

          make_header() {
            printf 'set ftp:ssl-force true\n'
            printf 'set ftp:ssl-protect-data true\n'
            printf 'set ssl:verify-certificate true\n'
            printf 'set ftp:passive-mode true\n'
            printf 'set net:max-retries 2\n'
            printf 'set net:timeout 20\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open -u "%s","%s" "ftp://%s:21"\n' "$WP_CONTENT_FTP_USER" "$WP_CONTENT_FTP_PASSWORD" "$WP_CONTENT_FTP_HOST"
          }

          {
            make_header
            printf 'find "plugins/criosrango-configuracion-inicio"\n'
            printf 'bye\n'
          } > "$FIND_SCRIPT"
          lftp -f "$FIND_SCRIPT" > "$WORK/config-plugin-files.txt"
          grep -E '^plugins/criosrango-configuracion-inicio/.*\.(php|css)$' "$WORK/config-plugin-files.txt" |
            grep -Ev '(^|/)\.\.?(/|$)' | sort -u > "$WORK/config-php-css.txt"

          echo "PLUGIN_PATH=plugins/criosrango-configuracion-inicio/"
          echo "PLUGIN_PHP_CSS_FILES=$(wc -l < "$WORK/config-php-css.txt" | tr -d ' ')"
          cat "$WORK/config-php-css.txt"

          {
            make_header
            while IFS= read -r remote_file; do
              [ -n "$remote_file" ] || continue
              local_file="$WORK/$remote_file"
              mkdir -p "$(dirname "$local_file")"
              printf 'get "%s" -o "%s"\n' "$remote_file" "$local_file"
            done < "$WORK/config-php-css.txt"
            printf 'bye\n'
          } > "$GET_SCRIPT"
          lftp -f "$GET_SCRIPT"

          echo "===== ENLACES / CAMPAIGN / TEMPLATE MATCHES ====="
          grep -RniE --include='*.php' --include='*.css' 'enlaces|campaña|campana|campaign|/enlaces|template|shortcode|page-shell|margin-top|padding-top|min-height' "$WORK/plugins/criosrango-configuracion-inicio" || true
