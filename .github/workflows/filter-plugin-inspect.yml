name: Temporary filter plugin source inspection

on:
  push:
    branches:
      - style/product-detail-app-skin
    paths:
      - ".github/workflows/filter-plugin-inspect.yml"

permissions:
  contents: read

jobs:
  inspect-filter-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact filter plugin PHP over verified FTPS
        shell: bash
        env:
          WP_CONTENT_FTP_HOST: ${{ secrets.WP_CONTENT_FTP_HOST }}
          WP_CONTENT_FTP_USER: ${{ secrets.WP_CONTENT_FTP_USER }}
          WP_CONTENT_FTP_PASSWORD: ${{ secrets.WP_CONTENT_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib, io, os
          ftp=ftplib.FTP_TLS(timeout=25)
          password=os.environ["WP_CONTENT_FTP_PASSWORD"]
          try:
              ftp.connect(os.environ["WP_CONTENT_FTP_HOST"],21)
              ftp.login(os.environ["WP_CONTENT_FTP_USER"],password)
              ftp.prot_p()
              target="plugins/criosrango-filtros-catalogo"
              ftp.cwd(target)
              print("FILTER_PLUGIN_FOUND=YES")
              print("PLUGIN_PATH="+target+"/")
              files=["criosrango-filtros-catalogo.php",
                     "includes/class-criosrango-filter-rest.php",
                     "includes/class-criosrango-filter-eligibility.php",
                     "includes/class-criosrango-filter-allowlist.php"]
              for path in files:
                  data=io.BytesIO()
                  ftp.retrbinary("RETR "+path,data.write)
                  source=data.getvalue().decode("utf-8","replace")
                  print("\n===== SOURCE_FILE: "+path+" =====")
                  print(source)
                  print("===== END_SOURCE_FILE: "+path+" =====")
          except Exception as e:
              print("INSPECTION_ERROR="+repr(e))
              raise
          finally:
              try: ftp.quit()
              except Exception: pass
              password=None
          PY
