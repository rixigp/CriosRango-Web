name: Export normalized category assets
on:
  push:
    branches:
      - asset-normalization-export
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize category PNG alpha bounds
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/normalize-category-assets.py --normalize
          mkdir -p /tmp/category-export
          cp theme/crios-rango-2026/assets/images/categories/*.png /tmp/category-export/
          python tools/normalize-category-assets.py --check
          cd /tmp/category-export
          zip -q /tmp/category-assets-normalized.zip *.png
      - uses: actions/upload-artifact@v4
        with:
          name: normalized-category-assets
          path: /tmp/category-assets-normalized.zip
          if-no-files-found: error
          retention-days: 3
